<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us</title><link rel="stylesheet" href="style.css"><script src="contact.js" defer></script></head>
<body><main class="contact-page"><a id="return" href="/">← Return to the store</a>
<h1>Contact Us</h1>
<form class="fields">
<label>Name<input name="name" required maxlength="120" autocomplete="name"></label>
<label>Email<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<label>Message<textarea name="message" rows="6" required minlength="5" maxlength="2000"></textarea></label>
<label hidden>Website<input name="website" tabindex="-1" autocomplete="off"></label>
<button class="add">Send enquiry</button>
<p role="status"></p>
</form></main><footer><p>Created by Libotech</p></footer></body></html>
